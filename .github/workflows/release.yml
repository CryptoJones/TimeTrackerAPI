#
# Release pipeline. Fires when a semver tag (v1.2.3) is pushed. Builds a
# multi-arch container image, pushes it to GHCR, signs it with cosign
# (keyless / OIDC — no long-lived keys), generates an SBOM, and cuts a
# GitHub Release whose notes come from the matching CHANGELOG section.
#
# The Codeberg mirror step is inert until you opt in: set the repository
# variable ENABLE_CODEBERG_MIRROR=true and add a CODEBERG_TOKEN secret.
name: release

on:
  push:
    tags: ['v*.*.*']

# Least-privilege, widened only where the release needs it:
#   contents: write      -> create the GitHub Release
#   packages: write      -> push the image to GHCR
#   id-token: write      -> cosign keyless signing via the OIDC token
#   attestations: write  -> build provenance attestation
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v6

      # Sanity gate: the pushed tag must match package.json's version so a
      # half-landed bump (tag without the version bump, or vice versa) fails
      # loudly instead of shipping a mislabeled image.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
        id: ver

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%:*}@${DIGEST}"
          done

      # Scan the source tree, not the pushed image: syft can't pull the
      # freshly-pushed (private) GHCR image, and GHCR rejects the
      # uppercase owner in `${{ github.repository }}` anyway. A source SBOM
      # is what we want to ship. Non-fatal — a SBOM hiccup must never block
      # the actual release.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: "."
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ steps.ver.outputs.version }}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $VER. See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: sbom.spdx.json
          fail_on_unmatched_files: false

      # ---- Codeberg mirror (opt-in) ----
      # Inert until you set repo variable ENABLE_CODEBERG_MIRROR=true and add
      # a CODEBERG_TOKEN secret. Mirrors the tag and opens a matching release
      # on Codeberg's Gitea API.
      - name: Mirror tag + release to Codeberg
        if: ${{ vars.ENABLE_CODEBERG_MIRROR == 'true' }}
        env:
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git push "https://CryptoJones:${CB_TOKEN}@codeberg.org/CryptoJones/TimeTrackerAPI.git" "refs/tags/v${VER}"
          NOTES="$(cat RELEASE_NOTES.md)"
          curl -fsSL -X POST \
            -H "Authorization: token ${CB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/CryptoJones/TimeTrackerAPI/releases" \
            -d "$(node -e "console.log(JSON.stringify({tag_name:'v'+process.env.VER,name:'v'+process.env.VER,body:require('fs').readFileSync('RELEASE_NOTES.md','utf8')}))")"
