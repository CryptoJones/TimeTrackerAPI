#
# One-line spin-up for local dev or a single-node deploy.
# Usage:
#   cp .env.example .env  (then set DB_PASSWORD)
#   docker compose up --build
#
# Service order:
#   postgres → setup (psql bootstrap) → migrate (sequelize-cli) → api
#
# `setup` applies the baseline SQL files; `migrate` runs every pending
# Sequelize migration on top. Both are one-shot (restart: "no"). The
# api service won't start until both have exited 0.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-timetracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-timetracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-timetracker} -d ${DB_NAME:-timetracker}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Don't expose 5432 to the host by default — the api service
    # reaches postgres via the compose network. Operators who need
    # local psql can `docker compose exec postgres psql ...`.

  # One-shot schema bootstrap. Runs after postgres is healthy, applies
  # both SQL files, then exits 0. Idempotent only against an empty DB;
  # against an existing schema the IF NOT EXISTS clauses (or lack
  # thereof) determine outcome — see setup/*.sql for the details.
  setup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-timetracker}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-timetracker}
    volumes:
      - ./setup:/setup:ro
    command: >
      sh -c "
        psql -v ON_ERROR_STOP=1 -f /setup/TimeTracker.sql &&
        psql -v ON_ERROR_STOP=1 -f /setup/TimeEntry.sql
      "
    restart: "no"

  # One-shot Sequelize migrations. Runs after the baseline SQL is in
  # place; applies every pending migration in app/migrations/ on top.
  # Re-uses the api image so we don't ship two near-identical Node
  # images. The first migration is a no-op baseline marker, so this
  # service can also be the "lets sequelize know the schema exists"
  # bootstrap for fresh installs.
  migrate:
    build: .
    image: timetrackerapi:latest
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-timetracker}
      DB_USER: ${DB_USER:-timetracker}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
    # npx + the locally-installed sequelize-cli — no global install
    # in the image, no apt installs at runtime.
    command: ["npx", "--no-install", "sequelize-cli", "db:migrate"]
    restart: "no"

  api:
    build: .
    image: timetrackerapi:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-timetracker}
      DB_USER: ${DB_USER:-timetracker}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      # Mirrors the Dockerfile-level healthcheck; redeclared so
      # `docker compose ps` shows readiness state cleanly.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
